{% extends "base.html" %}

{% block title %}Access Denied (403) | Education Management Portal{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1rem; text-align: center; max-width: 600px; margin: 0 auto;">
  <div style="font-size: 4rem; font-weight: 800; color: #ef4444; margin-bottom: 0.5rem;">403</div>
  <h1 style="font-size: 1.8rem; margin: 0 0 1rem 0;">Access Restricted</h1>
  <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 2rem;">
    You do not possess authorized role permissions (RBAC) to view or modify this academic resource.
  </p>
  <div style="display: flex; justify-content: center; gap: 1rem;">
    <a href="{% url 'public:home' %}" class="btn btn-primary">Return to Home</a>
    <a href="{% url 'portal:dispatcher' %}" class="btn btn-outline">My Portal Dashboard</a>
  </div>
</div>
{% endblock %}
