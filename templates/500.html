<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error (500) | Education Management Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 3rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      margin: 1rem;
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      color: #ef4444;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 1rem 0;
    }
    p {
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.65rem 1.25rem;
      background: #1d4ed8;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">500</div>
    <h1>System Processing Exception</h1>
    <p>
      An unexpected internal server exception occurred while processing this request. The incident has been recorded in system telemetry logs.
    </p>
    <a href="/" class="btn">Return to Portal</a>
  </div>
</body>
</html>
